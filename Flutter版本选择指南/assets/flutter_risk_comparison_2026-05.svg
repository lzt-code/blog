  <text x="525" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 避开激进风险</text>
  <text x="525" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">使用建议</text>
  <text x="525" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 生产强烈推荐</text>
