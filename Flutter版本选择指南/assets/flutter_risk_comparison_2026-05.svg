  <rect x="35" y="440" width="780" height="60" rx="15" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="425" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34a853">一句话建议</text>
  <text x="425" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">生产环境强烈推荐 3.41 系列；老旧项目求稳留守 3.38；3.44 仅限独立分支尝鲜与技术储备。</text>
