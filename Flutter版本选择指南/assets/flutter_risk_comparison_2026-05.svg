  <text x="725" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">使用建议</text>
  <text x="725" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 独立分支尝鲜</text>
