<svg width="900" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="productionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="developmentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techExplorationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="360" fill="#f8f9fa"/>

  <!-- 标题 -->
  <text x="450" y="38" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a73e8">不同场景Flutter版本选择指南 (2026-10)</text>

  <!-- 生产环境 -->
  <rect x="50" y="70" width="250" height="210" rx="15" fill="url(#productionGradient)" filter="url(#shadow)"/>
  <text x="175" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">🏭 生产环境</text>
  <rect x="80" y="130" width="190" height="55" rx="10" fill="white" opacity="0.92"/>
  <text x="175" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#137333">Flutter 3.44.9</text>
  <text x="175" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">11周零补丁，本月启动迁移</text>
  <text x="175" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">11月上旬收口</text>

  <!-- 开发环境与新项目 -->
  <rect x="325" y="70" width="250" height="210" rx="15" fill="url(#developmentGradient)" filter="url(#shadow)"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">💻 开发与新项目</text>
  <rect x="355" y="130" width="190" height="55" rx="10" fill="white" opacity="0.92"/>
  <text x="450" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1a73e8">Flutter 3.44.9</text>
  <text x="450" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">起步即在12月SwiftPM门槛之上</text>
  <text x="450" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">少迁一次依赖管理</text>

  <!-- 技术预研 -->
  <rect x="600" y="70" width="250" height="210" rx="15" fill="url(#techExplorationGradient)" filter="url(#shadow)"/>
  <text x="725" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">🧪 技术预研</text>
  <rect x="630" y="130" width="190" height="55" rx="10" fill="white" opacity="0.92"/>
  <text x="725" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#6a1b9a">Flutter 3.47.7</text>
  <text x="725" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">替11月设计库废弃探路</text>
  <text x="725" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">验证Genkit Dart 1.0</text>

  <!-- 底部总结 -->
  <rect x="50" y="305" width="800" height="40" fill="white" stroke="#e0e0e0" rx="5"/>
  <text x="450" y="325" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">💡 10月策略：生产与新项目用 3.44.9；3.41.9本月启动迁移；3.47.7预研探路。</text>
</svg>
