<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="productionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="developmentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techExplorationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="600" fill="#f8f9fa"/>

  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a73e8">不同场景Flutter版本选择指南 (2026-05)</text>

  <!-- 生产环境 -->
  <rect x="50" y="80" width="250" height="450" rx="15" fill="url(#productionGradient)" filter="url(#shadow)"/>
  <text x="175" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">🏭 生产环境</text>
  <text x="175" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">全面迁移</text>

  <!-- 生产环境推荐版本 -->
  <rect x="70" y="145" width="210" height="75" rx="10" fill="white" opacity="0.9"/>
  <text x="175" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#34a853">首选：Flutter 3.41.9</text>
  <text x="175" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f9ab00">淘汰：老版本 3.38</text>
  <text x="175" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">最佳的升级迁移窗口期</text>

  <!-- 生产环境原则 -->
  <text x="70" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">选择理由：</text>
  <text x="70" y="255" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 3.41 版本已完全成熟</text>
  <text x="70" y="270" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 解决 iOS UISense 生命周期</text>
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 基础设施稳定可靠</text>

  <text x="70" y="325" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">风险提示：</text>
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="11" fill="white">⚠ 尽快从 3.38 等老版本迁出</text>
  <text x="70" y="360" font-family="Arial, sans-serif" font-size="11" fill="white">⚠ 注意老旧插件的兼容性测试</text>

  <!-- 升级策略 -->
  <rect x="70" y="410" width="210" height="70" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="175" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">迁移建议</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="10" fill="white">1. 5月全面推进 3.41.9</text>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="10" fill="white">2. 清理历史遗留兼容代码</text>

  <!-- 开发环境与新项目 -->
  <rect x="325" y="80" width="250" height="450" rx="15" fill="url(#developmentGradient)" filter="url(#shadow)"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">💻 开发与新项目</text>
  <text x="450" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">基础设施求稳</text>

  <!-- 开发环境推荐版本 -->
  <rect x="345" y="145" width="210" height="75" rx="10" fill="white" opacity="0.9"/>
  <text x="450" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4285f4">推荐：Flutter 3.41.9</text>
  <text x="450" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ea4335">避坑：Flutter 3.44.0</text>
  <text x="450" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">避免把时间浪费在排查报错上</text>

  <!-- 开发环境优势 -->
  <text x="345" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">选择理由：</text>
  <text x="345" y="255" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 启动初期需要极度稳定</text>
  <text x="345" y="270" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 插件生态完美适配</text>
  <text x="345" y="285" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 团队协作无额外心智负担</text>

  <text x="345" y="325" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">注意事项：</text>
  <text x="345" y="345" font-family="Arial, sans-serif" font-size="11" fill="white">⚠ 3.44 有大量三方库未适配</text>
  <text x="345" y="360" font-family="Arial, sans-serif" font-size="11" fill="white">⚠ 易遇 SwiftPM 插件编译报错</text>
  <text x="345" y="375" font-family="Arial, sans-serif" font-size="11" fill="white">⚠ 易遇 AGP 9.0 导致的报错</text>

  <!-- 开发环境策略 -->
  <rect x="345" y="410" width="210" height="70" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="450" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">使用策略</text>
  <text x="355" y="445" font-family="Arial, sans-serif" font-size="10" fill="white">1. 新项目坚定选择 3.41.9</text>
  <text x="355" y="460" font-family="Arial, sans-serif" font-size="10" fill="white">2. 避免盲目追求新特性</text>

  <!-- 技术预研 -->
  <rect x="600" y="80" width="250" height="450" rx="15" fill="url(#techExplorationGradient)" filter="url(#shadow)"/>
  <text x="725" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">🧪 技术预研</text>
  <text x="725" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">探索前沿特性</text>

  <!-- 技术预研推荐版本 -->
  <rect x="620" y="145" width="210" height="60" rx="10" fill="white" opacity="0.9"/>
  <text x="725" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">推荐：Flutter 3.44.0</text>
  <text x="725" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">感受 GenUI 与</text>
  <text x="725" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">智能体热重载的魅力</text>

  <!-- 技术预研优势 -->
  <text x="620" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">选择理由：</text>
  <text x="620" y="255" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 体验最新的 GenUI 能力</text>
  <text x="620" y="270" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 尝试智能体热重载</text>
  <text x="620" y="285" font-family="Arial, sans-serif" font-size="11" fill="white">✓ 提前了解下代架构演进</text>

  <text x="620" y="325" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">启动建议：</text>
  <text x="620" y="345" font-family="Arial, sans-serif" font-size="11" fill="white">• 严禁用于任何生产环境</text>
  <text x="620" y="360" font-family="Arial, sans-serif" font-size="11" fill="white">• 预期会有大量编译报错</text>
  <text x="620" y="375" font-family="Arial, sans-serif" font-size="11" fill="white">• 仅限业余时间项目体验</text>

  <!-- 技术预研策略 -->
  <rect x="620" y="410" width="210" height="70" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="725" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">使用策略</text>
  <text x="630" y="445" font-family="Arial, sans-serif" font-size="10" fill="white">1. 专门拉取一个独立分支</text>
  <text x="630" y="460" font-family="Arial, sans-serif" font-size="10" fill="white">2. 或在个人业余项目中使用</text>

  <!-- 底部总结 -->
  <rect x="50" y="550" width="800" height="40" fill="white" stroke="#e0e0e0" rx="5"/>
  <text x="70" y="570" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">💡 总结：</text>
  <text x="140" y="570" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">5月版本策略：生产与新项目坚定使用 3.41.9，技术预研可尝试 3.44.0 体验 GenUI 与智能体热重载。</text>
</svg>