<svg width="850" height="340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="safeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbc04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9ab00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dangerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d33b2c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="850" height="340" fill="#f8f9fa"/>
  <text x="425" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a73e8">Flutter版本风险评估对比 (2026.10)</text>

  <!-- 3.38 -->
  <rect x="35" y="60" width="190" height="190" rx="10" fill="url(#dangerGradient)" filter="url(#shadow)"/>
  <text x="130" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Flutter 3.38</text>
  <rect x="65" y="118" width="130" height="30" rx="15" fill="white" opacity="0.25"/>
  <text x="130" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">大限已过</text>
  <text x="130" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">★☆☆☆☆</text>
  <text x="130" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">iOS事实停发，直接跳3.44.9</text>

  <!-- 3.41 -->
  <rect x="240" y="60" width="190" height="190" rx="10" fill="url(#safeGradient)" filter="url(#shadow)"/>
  <text x="335" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Flutter 3.41</text>
  <rect x="270" y="118" width="130" height="30" rx="15" fill="white" opacity="0.25"/>
  <text x="335" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">交棒倒计时</text>
  <text x="335" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">★★★★☆</text>
  <text x="335" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">零补丁近6个月，本月启动迁移</text>

  <!-- 3.44 -->
  <rect x="445" y="60" width="190" height="190" rx="10" fill="url(#warningGradient)" filter="url(#shadow)"/>
  <text x="540" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Flutter 3.44</text>
  <rect x="475" y="118" width="130" height="30" rx="15" fill="white" opacity="0.25"/>
  <text x="540" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Q4基线转正</text>
  <text x="540" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">★★★★★</text>
  <text x="540" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">11周零补丁，年底前最稳落脚点</text>

  <!-- 3.47 -->
  <rect x="650" y="60" width="190" height="190" rx="10" fill="url(#techGradient)" filter="url(#shadow)"/>
  <text x="745" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Flutter 3.47</text>
  <rect x="680" y="118" width="130" height="30" rx="15" fill="white" opacity="0.25"/>
  <text x="745" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">磨合收尾</text>
  <text x="745" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">★★★☆☆</text>
  <text x="745" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">已安静两周，11月中旬再评估</text>

  <!-- Bottom bar -->
  <rect x="35" y="275" width="805" height="45" rx="15" fill="rgba(26,115,232,0.1)" stroke="#1a73e8" stroke-width="1"/>
  <text x="425" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#137333">💡 生产与新项目用 3.44.9；3.41.9本月启动迁移；3.47.7预研探路。</text>
</svg>
