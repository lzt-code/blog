<svg width="850" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="safeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbc04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9ab00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dangerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d33b2c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="850" height="540" fill="#f8f9fa"/>
  <text x="425" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a73e8">Flutter版本风险评估对比 (2026.09)</text>

  <!-- 3.38 Deadline Passed -->
  <rect x="35" y="60" width="190" height="420" rx="10" fill="url(#dangerGradient)" filter="url(#shadow)"/>
  <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Flutter 3.38</text>
  <text x="130" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2026年2月</text>
  <circle cx="130" cy="155" r="25" fill="#ea4335" stroke="white" stroke-width="3"/>
  <text x="130" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">!</text>
  <text x="130" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">大限已过</text>
  <text x="130" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">现实处境</text>
  <text x="130" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• UIScene强制已生效</text>
  <text x="130" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Xcode 27构建启动失败</text>
  <text x="130" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• iOS侧事实停发</text>
  <text x="130" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">使用建议</text>
  <text x="130" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 立即升级3.41.9</text>
  <text x="130" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 已无任何缓冲</text>
  <rect x="45" y="370" width="170" height="25" rx="12" fill="white" opacity="0.9"/>
  <text x="130" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d33b2c">推荐指数: ★☆☆☆☆</text>
  <rect x="45" y="405" width="170" height="60" rx="8" fill="white" opacity="0.15"/>
  <text x="130" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">9月大限已经落地，</text>
  <text x="130" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">留在3.38等于放弃iOS发版</text>

  <!-- 3.41 Production -->
  <rect x="240" y="60" width="190" height="420" rx="10" fill="url(#safeGradient)" filter="url(#shadow)"/>
  <text x="335" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Flutter 3.41</text>
  <text x="335" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2026年4月</text>
  <circle cx="335" cy="155" r="25" fill="#34a853" stroke="white" stroke-width="3"/>
  <text x="335" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">★</text>
  <text x="335" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">绝对主力</text>
  <text x="335" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">主要优势</text>
  <text x="335" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 零补丁近5个月</text>
  <text x="335" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 9月大限平稳过渡</text>
  <text x="335" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• AI编码友好度高</text>
  <text x="335" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">使用建议</text>
  <text x="335" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 生产强烈推荐</text>
  <text x="335" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Q4规划单次迁移</text>
  <rect x="250" y="370" width="170" height="25" rx="12" fill="white" opacity="0.9"/>
  <text x="335" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34a853">推荐指数: ★★★★★</text>
  <rect x="250" y="405" width="170" height="60" rx="8" fill="white" opacity="0.15"/>
  <text x="335" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">5月至今零补丁，</text>
  <text x="335" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">大限落地后依然最稳</text>

  <!-- 3.44 Q4 Baseline -->
  <rect x="445" y="60" width="190" height="420" rx="10" fill="url(#warningGradient)" filter="url(#shadow)"/>
  <text x="540" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Flutter 3.44</text>
  <text x="540" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2026年5月</text>
  <circle cx="540" cy="155" r="25" fill="#fbbc04" stroke="white" stroke-width="3"/>
  <text x="540" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">✓</text>
  <text x="540" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Q4基线候选</text>
  <text x="540" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">关注要点</text>
  <text x="540" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 连续两月零补丁</text>
  <text x="540" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 12月SwiftPM门槛</text>
  <text x="540" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 插件生态适配成熟</text>
  <text x="540" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">使用建议</text>
  <text x="540" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 原地停留可继续</text>
  <text x="540" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Q4验证基线首选</text>
  <rect x="455" y="370" width="170" height="25" rx="12" fill="white" opacity="0.9"/>
  <text x="540" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f9ab00">推荐指数: ★★★★☆</text>
  <rect x="455" y="405" width="170" height="60" rx="8" fill="white" opacity="0.15"/>
  <text x="540" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">两月零补丁通过观察期，</text>
  <text x="540" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">12月门槛的稳妥基线</text>

  <!-- 3.47 Still Stabilizing -->
  <rect x="650" y="60" width="190" height="420" rx="10" fill="url(#techGradient)" filter="url(#shadow)"/>
  <text x="745" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Flutter 3.47</text>
  <text x="745" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2026年8月</text>
  <circle cx="745" cy="155" r="25" fill="#9c27b0" stroke="white" stroke-width="3"/>
  <text x="745" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">N</text>
  <text x="745" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">磨合期继续</text>
  <text x="745" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">关注要点</text>
  <text x="745" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 一个月连发4补丁</text>
  <text x="745" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• .3到.4仅隔两天</text>
  <text x="745" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Xcode 27白屏已修复</text>
  <text x="745" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">使用建议</text>
  <text x="745" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 测试环境预研</text>
  <text x="745" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 生产再等一等</text>
  <rect x="660" y="370" width="170" height="25" rx="12" fill="white" opacity="0.9"/>
  <text x="745" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6a1b9a">推荐指数: ★★★☆☆</text>
  <rect x="660" y="405" width="170" height="60" rx="8" fill="white" opacity="0.15"/>
  <text x="745" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">修复密度仍然偏高，</text>
  <text x="745" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">但收敛方向已经清晰</text>

  <!-- Bottom recommendation bar -->
  <rect x="35" y="495" width="780" height="45" rx="15" fill="rgba(26,115,232,0.1)" stroke="#1a73e8" stroke-width="1"/>
  <text x="425" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a73e8">💡 9月一句话建议</text>
  <rect x="35" y="510" width="780" height="35" rx="10" fill="rgba(52,168,83,0.1)"/>
  <text x="425" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#137333">生产继续 3.41.9；3.38立即迁移已无退路；Q4以3.44.9为基线验证12月SwiftPM；3.47.5测试环境预研。</text>
</svg>
